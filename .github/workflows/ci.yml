name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pip install -e ".[dev]"  # enable when package is defined
      - name: Placeholder quality gate
        run: |
          echo "x4-core CI placeholder — replace with real lint/typecheck/test once source lands"
          python -c "print('ok')"
